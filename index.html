<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rohan Hammond and Amalfi Media campaign portfolio for Liberal political media, video, photography, communications, and social strategy."
    />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <script>
      if (
        window.location.protocol === "http:" &&
        /(^|\.)rohanhammond\.com$/i.test(window.location.hostname)
      ) {
        window.location.replace(
          "https://" +
            window.location.host +
            window.location.pathname +
            window.location.search +
            window.location.hash,
        );
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Rohan Hammond / Amalfi Media</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
